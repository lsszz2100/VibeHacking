global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 4096
    user haproxy
    group haproxy

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    retries 3
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

# Primary Node Routing (Port 5000: Writes)
frontend pg_primary_front
    bind *:5000
    default_backend pg_primary_back

backend pg_primary_back
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg1 10.0.1.21:5432 maxconn 200 check port 8008
    server pg2 10.0.1.22:5432 maxconn 200 check port 8008
    server pg3 10.0.1.23:5432 maxconn 200 check port 8008

# Replicas Routing (Port 5001: Reads / Load Balanced)
frontend pg_replicas_front
    bind *:5001
    default_backend pg_replicas_back

backend pg_replicas_back
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server pg1 10.0.1.21:5432 maxconn 500 check port 8008
    server pg2 10.0.1.22:5432 maxconn 500 check port 8008
    server pg3 10.0.1.23:5432 maxconn 500 check port 8008
