events {
    worker_connections 1024;
}

http {
    upstream dvwa_backend {
        server dvwa:80;
    }
    upstream juiceshop_backend {
        server juice-shop:3000;
    }
    upstream webgoat_backend {
        server webgoat:8080;
    }
    upstream sqlmap_backend {
        server sqlmap-target:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # DVWA — /dvwa/
        location /dvwa/ {
            proxy_pass http://dvwa_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Juice Shop — /juice/
        location /juice/ {
            proxy_pass http://juiceshop_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebGoat — /webgoat/
        location /webgoat/ {
            proxy_pass http://webgoat_backend/WebGoat/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SQLi 타겟 — /sqli/
        location /sqli/ {
            proxy_pass http://sqlmap_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 기본 안내 페이지
        location / {
            return 200 '<html><body>
<h1>Web Hacking Lab</h1>
<ul>
<li><a href="/dvwa/">DVWA</a></li>
<li><a href="/juice/">OWASP Juice Shop</a></li>
<li><a href="/webgoat/">WebGoat</a></li>
<li><a href="/sqli/">SQLi Target</a></li>
</ul>
</body></html>';
            add_header Content-Type text/html;
        }
    }
}
