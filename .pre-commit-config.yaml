# VibeHacking Pre-commit Security & Quality Hooks
# To install: pip install pre-commit && pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=50000']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
        exclude: ^(\.github/|labs/)
      - id: check-json
      - id: end-of-file-fixer
        exclude: ^(labs/|wargame/assets/challenges\.js)
      - id: trailing-whitespace
        exclude: ^(labs/|wargame/assets/challenges\.js|\.patch$)

  # Secret & Credential Leak Prevention
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Python AST Security SAST
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ['-s', 'B101,B404,B603,B607', '--severity-level', 'medium']
        files: ^(vhack\.py|tools/.*\.py)$
