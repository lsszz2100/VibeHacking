version: "3.8"

networks:
  firmware_lab_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/24

volumes:
  analyzer_workspace:

services:

  # binwalk + 분석 도구가 설치된 분석 서버
  firmware_analyzer:
    image: ubuntu:22.04
    container_name: firmware_analyzer
    command: >
      bash -c "apt-get update -qq &&
               apt-get install -y -qq binwalk squashfs-tools file
               qemu-user-static python3 python3-pip &&
               pip3 install -q pycryptodome &&
               tail -f /dev/null"
    volumes:
      - ./firmware_images:/firmware:ro
      - analyzer_workspace:/workspace
    networks:
      firmware_lab_net:
        ipv4_address: 172.19.0.10
    ports:
      - "8061:8080"
    restart: unless-stopped

  # 취약한 웹 관리 패널 (펌웨어 업데이트 기능 시뮬레이션)
  firmware_web_panel:
    image: python:3.11-slim
    container_name: firmware_web_panel
    command: >
      bash -c "pip install -q flask &&
               python3 /app/app.py"
    volumes:
      - ./firmware_panel.py:/app/app.py:ro
    networks:
      firmware_lab_net:
        ipv4_address: 172.19.0.20
    ports:
      - "8062:8080"
    restart: unless-stopped
