name: Deploy Unified Portal & Wargame to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Wargame Pre-Deploy Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: 1. Verify Challenge Integrity & Structural Invariants
        run: node wargame/scripts/verify.js

      - name: 2. Cross-Challenge Answer Leak Scan
        run: node wargame/scripts/leakscan.js

      - name: 3. Grader Heuristics & Strict Anti-Ambiguity Audit
        run: node wargame/scripts/audit.js --strict

      - name: 4. Automated Ciphertext / Derivable Solver Engine
        run: node wargame/scripts/solve-derivable.js

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Setup Node.js
        if: always()
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Verify Live Wargame Deployment
        if: always()
        run: node wargame/scripts/live-check.js "${{ steps.deployment.outputs.page_url || steps.pages.outputs.base_url }}wargame/"
