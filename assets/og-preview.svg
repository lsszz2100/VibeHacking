<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02060a"/>
      <stop offset="50%" stop-color="#07121b"/>
      <stop offset="100%" stop-color="#010408"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27ff8b"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27ff8b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff0055" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0f2638" stroke-width="1" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Terminal Window Header -->
  <rect x="40" y="40" width="1120" height="52" rx="8" fill="#0b1723" stroke="#183652" stroke-width="1"/>
  <circle cx="70" cy="66" r="7" fill="#ff5f56"/>
  <circle cx="95" cy="66" r="7" fill="#ffbd2e"/>
  <circle cx="120" cy="66" r="7" fill="#27c93f"/>
  <text x="150" y="72" fill="#6488a6" font-family="'Courier New', monospace" font-size="16" font-weight="bold">terminal@vibehacking:~ / infiltrate vibe.corp</text>
  <text x="1060" y="72" fill="#27ff8b" font-family="'Courier New', monospace" font-size="15" font-weight="bold">● LIVE 1820/1820</text>

  <!-- Main Title Area -->
  <g transform="translate(60, 150)">
    <!-- Terminal Prompt Prompt -->
    <text x="0" y="30" fill="#27ff8b" font-family="'Fira Code', 'Courier New', monospace" font-size="32" font-weight="bold">&gt; root# init --exploit-framework</text>

    <!-- Project Title -->
    <text x="0" y="115" fill="url(#greenGrad)" font-family="'Fira Code', 'Segoe UI', system-ui, sans-serif" font-size="74" font-weight="900" letter-spacing="-1">VIBEHACKING</text>
    <text x="590" y="115" fill="#ffffff" font-family="'Fira Code', system-ui, sans-serif" font-size="34" font-weight="300" opacity="0.9">BIBLE &amp; WARGAME</text>

    <!-- Subtitle Korean -->
    <text x="0" y="175" fill="#f0f6fc" font-family="'Noto Sans KR', 'Pretendard', sans-serif" font-size="28" font-weight="700">실전 사이버보안 완전 정복 · 브라우저 터미널 워게임 포털</text>

    <!-- Subtitle English -->
    <text x="0" y="215" fill="#8b949e" font-family="'Fira Code', 'Courier New', monospace" font-size="18">Offensive &amp; Defensive Cybersecurity Hub · 75 Chapters · 38 Labs · 1,820 CTF Challenges</text>

    <!-- Stats Badges Container -->
    <g transform="translate(0, 260)">
      <!-- Badge 1: 75 Chapters -->
      <rect x="0" y="0" width="220" height="54" rx="8" fill="#112233" stroke="#27ff8b" stroke-width="1.5"/>
      <text x="20" y="34" fill="#27ff8b" font-family="'Fira Code', monospace" font-size="20" font-weight="bold">📚 75 SECTIONS</text>

      <!-- Badge 2: 38 Labs -->
      <rect x="235" y="0" width="220" height="54" rx="8" fill="#112233" stroke="#00f0ff" stroke-width="1.5"/>
      <text x="255" y="34" fill="#00f0ff" font-family="'Fira Code', monospace" font-size="20" font-weight="bold">🔬 38 HANDS-ON LABS</text>

      <!-- Badge 3: 1820 Challenges -->
      <rect x="470" y="0" width="260" height="54" rx="8" fill="#112233" stroke="#ffaa00" stroke-width="1.5"/>
      <text x="490" y="34" fill="#ffaa00" font-family="'Fira Code', monospace" font-size="20" font-weight="bold">🎮 1,820 WARGAME CTF</text>

      <!-- Badge 4: 8 Simulators -->
      <rect x="745" y="0" width="260" height="54" rx="8" fill="#112233" stroke="#a371f7" stroke-width="1.5"/>
      <text x="765" y="34" fill="#a371f7" font-family="'Fira Code', monospace" font-size="20" font-weight="bold">🛡️ 8 EDR/SIMULATORS</text>
    </g>

    <!-- Topics Pills -->
    <g transform="translate(0, 345)" font-family="'Fira Code', monospace" font-size="14" fill="#7d8590">
      <text x="0" y="0">REVERSING · PWN · KERNEL · EDR BYPASS · AI SECURITY · CLOUD · HARDWARE · ZERO TRUST</text>
    </g>
  </g>

  <!-- Footer Link Info -->
  <line x1="40" y1="550" x2="1160" y2="550" stroke="#1b3147" stroke-width="1"/>
  <text x="60" y="582" fill="#58a6ff" font-family="'Fira Code', monospace" font-size="17" font-weight="bold">🌐 https://lsszz2100.github.io/VibeHacking/</text>
  <text x="1000" y="582" fill="#8b949e" font-family="'Fira Code', monospace" font-size="15">MIT License · Open Source</text>
</svg>
