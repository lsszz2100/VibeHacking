# pgBackRest Multi-Tiered Backup & Redundancy Configuration
# 3-2-1-1-0 Enterprise Strategy Implementation

[global]
# [Tier 1: Hot/Warm] Local POSIX Storage
repo1-type=posix
repo1-path=/var/lib/pgbackrest
repo1-retention-full=4
repo1-retention-diff=14
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=LocalRepoSecretKeyPassphrase2026!

# [Tier 2: Cold/WORM] Remote S3 Immutable Storage (Object Lock)
repo2-type=s3
repo2-s3-endpoint=s3.ap-northeast-2.amazonaws.com
repo2-s3-bucket=vibe-db-immutable-backup-vault
repo2-s3-region=ap-northeast-2
repo2-s3-key-type=auto
repo2-path=/pgbackrest-s3-repo
repo2-retention-full=12
repo2-cipher-type=aes-256-cbc
repo2-cipher-pass=RemoteVaultSecretKeyPassphrase2026!
repo2-storage-ca-file=/etc/ssl/certs/ca-certificates.crt

# Global Optimization & Integrity
compress-type=zst
compress-level=6
process-max=8
checksum-page=y
start-fast=y
stop-auto=y
buffer-size=16MiB

# Logging
log-level-console=info
log-level-file=detail

[vibe-cluster]
pg1-path=/var/lib/postgresql/16/data
pg1-user=postgres
pg1-host-user=postgres
