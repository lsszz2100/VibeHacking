version: "3.8"

networks:
  mobile_lab_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  analyzer_ws:

services:

  # APK 분석 도구 컨테이너
  apk_analyzer:
    image: ubuntu:22.04
    container_name: apk_analyzer
    command: >
      bash -c "apt-get update -qq &&
               apt-get install -y -qq default-jdk wget unzip python3 python3-pip file curl &&
               pip3 -q install frida-tools objection &&
               tail -f /dev/null"
    volumes:
      - ./apk_samples:/apk:ro
      - analyzer_ws:/workspace
    networks:
      mobile_lab_net:
        ipv4_address: 172.20.0.10
    ports:
      - "8071:8080"
    restart: unless-stopped

  # 취약한 모바일 백엔드 API (JWT alg:none, 하드코딩 키)
  mobile_api:
    image: python:3.11-slim
    container_name: mobile_api
    command: >
      bash -c "pip install -q flask pyjwt &&
               python3 /app/app.py"
    volumes:
      - ./mobile_api.py:/app/app.py:ro
    networks:
      mobile_lab_net:
        ipv4_address: 172.20.0.20
    ports:
      - "8072:8080"
    restart: unless-stopped
