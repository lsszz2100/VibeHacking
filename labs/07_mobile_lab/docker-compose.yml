version: "3.8"

networks:
  mobile_lab_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  analyzer_ws:

services:

  # APK 분석 도구 컨테이너
  apk_analyzer:
    image: ubuntu:22.04
    container_name: apk_analyzer
    command: >
      bash -c "apt-get update -qq &&
               apt-get install -y -qq default-jdk wget unzip python3 python3-pip file curl &&
               pip3 -q install frida-tools objection &&
               tail -f /dev/null"
    volumes:
      - ./apk_samples:/apk:ro
      - analyzer_ws:/workspace
    networks:
      mobile_lab_net:
        ipv4_address: 172.20.0.10
    ports:
      - "8071:8080"
    restart: unless-stopped

  # 취약한 모바일 백엔드 API (JWT alg:none, 하드코딩 키)
  mobile_api:
    image: python:3.11-slim
    container_name: mobile_api
    command: >
      bash -c "pip install -q flask pyjwt &&
               python3 -c \"
import jwt, base64, json, hashlib
from flask import Flask, request, jsonify
app = Flask(__name__)

HARDCODED_API_KEY = 'sk-mobile-dev-key-2024-insecure'
FLAG_1 = 'CTF{hardcoded_api_key_in_apk}'
FLAG_2 = 'CTF{jwt_alg_none_bypass}'

@app.route('/')
def index():
    return jsonify({'api': 'MobileApp Backend v2.1', 'endpoints': ['/login', '/data', '/admin']})

@app.route('/login', methods=['POST'])
def login():
    data = request.get_json() or {}
    if data.get('api_key') == HARDCODED_API_KEY:
        token = jwt.encode({'user': 'guest', 'role': 'user'}, 'secret', algorithm='HS256')
        return jsonify({'token': token, 'flag': FLAG_1})
    return jsonify({'error': 'invalid key'}), 401

@app.route('/data', methods=['GET'])
def data():
    return jsonify({'hint': 'API key is hardcoded in the APK. Check BuildConfig or network layer.'})

@app.route('/admin', methods=['GET'])
def admin():
    auth = request.headers.get('Authorization', '')
    if not auth.startswith('Bearer '):
        return jsonify({'error': 'no token'}), 401
    token = auth[7:]
    try:
        header = json.loads(base64.b64decode(token.split('.')[0] + '==').decode())
        if header.get('alg', '').lower() == 'none':
            payload = json.loads(base64.b64decode(token.split('.')[1] + '==').decode())
            if payload.get('role') == 'admin':
                return jsonify({'flag': FLAG_2, 'secret': 'admin_panel_data'})
    except:
        pass
    return jsonify({'error': 'forbidden'}), 403

app.run(host='0.0.0.0', port=8080)
\""
    networks:
      mobile_lab_net:
        ipv4_address: 172.20.0.20
    ports:
      - "8072:8080"
    restart: unless-stopped
