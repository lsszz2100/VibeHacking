name: Deploy Wargame (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'wargame/**'
      - '.github/workflows/deploy-wargame.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify challenge integrity (structure, no leaks, counts in sync)
        run: node wargame/scripts/verify.js

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages with the GitHub Actions source if not already enabled.
          enablement: true

      - name: Upload wargame as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./wargame

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
