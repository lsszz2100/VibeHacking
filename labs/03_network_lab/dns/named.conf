// 취약한 BIND9 설정 — zone transfer 허용 (교육 목적)
options {
    directory "/var/cache/bind";
    allow-recursion { any; };
    allow-query { any; };
    // 취약 포인트: any에서 zone transfer 허용
    allow-transfer { any; };
    forwarders {
        8.8.8.8;
        8.8.4.4;
    };
    dnssec-validation no;
    listen-on { any; };
    listen-on-v6 { none; };
};

// 내부 도메인 존
zone "corp.local" IN {
    type master;
    file "/etc/bind/zones/corp.local.zone";
    allow-transfer { any; };
    notify no;
};

zone "20.172.in-addr.arpa" IN {
    type master;
    file "/etc/bind/zones/reverse.zone";
    allow-transfer { any; };
};
