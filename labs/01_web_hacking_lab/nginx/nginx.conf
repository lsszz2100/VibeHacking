events {
    worker_connections 1024;
}

http {
    upstream dvwa_backend {
        server dvwa:80;
    }
    upstream sqlmap_backend {
        server sqlmap-target:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # DVWA — /dvwa/
        location /dvwa/ {
            proxy_pass http://dvwa_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SQLi 타겟 — /sqli/
        location /sqli/ {
            proxy_pass http://sqlmap_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 기본 안내 페이지
        location / {
            return 200 '<html><body style="font-family:monospace;background:#0d1117;color:#c9d1d9;padding:40px">
<h1>Web Hacking Lab</h1>
<ul>
<li><a href="/dvwa/" style="color:#58a6ff">DVWA</a> — http://localhost:8080/dvwa/</li>
<li><a href="http://localhost:3001" style="color:#58a6ff">OWASP Juice Shop</a> — http://localhost:3001</li>
<li><a href="http://localhost:8081/WebGoat" style="color:#58a6ff">WebGoat</a> — http://localhost:8081/WebGoat</li>
<li><a href="/sqli/" style="color:#58a6ff">SQLi Target</a> — http://localhost:8080/sqli/</li>
</ul>
</body></html>';
            add_header Content-Type text/html;
        }
    }
}
