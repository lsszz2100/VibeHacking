name: Deploy Wargame (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'wargame/**'
      - '.github/workflows/deploy-wargame.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify challenge integrity (structure, no leaks, counts in sync)
        run: node wargame/scripts/verify.js

      # Catches the leak verify.js structurally cannot see: an answer of one
      # challenge sitting in plain text in another challenge's prompt or hints.
      # Runs without --reveal so the log never prints the offending token.
      - name: Scan for cross-challenge answer leaks
        run: node wargame/scripts/leakscan.js

      # Catches what neither of the above can: a challenge promising a format
      # (declared length, a "$" marker) that the grader does not actually
      # accept, so a player following the stated format is marked wrong ([G]),
      # README's own tier table handing out an answer as a topic ([F]), and a
      # fmt that drifts off the notation rules or hides a spelling ambiguity
      # the player will be marked wrong for ([H]).
      # Those three gate the build — the other sections stay informational, and
      # the [A] MISSING lines are a known heuristic false positive. Runs
      # without --reveal, so a leaked term is reported by id only; the log
      # carries no plaintext answers, just ids and recovered shapes.
      - name: Check README and answer formats against the grader
        run: node wargame/scripts/audit.js --strict

      # The above are all static checks. This one actually plays the game:
      # every challenge that ships a ciphertext or a planted flag is solved
      # from its own prompt and submitted to the app's grading rule, so a
      # challenge whose stated instructions no longer lead to the accepted
      # answer fails the build. Runs without --reveal, so no derived
      # plaintext reaches the log.
      - name: Solve every derivable challenge from its own prompt
        run: node wargame/scripts/solve-derivable.js

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages with the GitHub Actions source if not already enabled.
          enablement: true

      - name: Upload wargame as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./wargame

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # No `timeout` here on purpose. 600000ms is both this action's
        # default and its hard maximum (MAX_TIMEOUT in deployment.js), so
        # the 30 minutes this repo tried to buy in July 2026 was never
        # available: 1800 was read as 1.8s — under the 5s first poll, so a
        # run passed only when Pages happened to beat that poll — and
        # 1800000 is silently clamped straight back to 600000. If the
        # backend ever sits in `deployment_queued` past 10 minutes again
        # the way it did on 2026-07-02, this input cannot wait it out;
        # check the live bytes and re-run instead.
        #
        # A failure here does not end the job any more — see the retry below.
        continue-on-error: true

      # Three of this workflow's fifteen historical failures were the backend
      # answering `Deployment failed, try again later.` (#16, #17, #19), and
      # the person who then re-ran the failed *job* got a different failure
      # instead: re-running the job re-runs the upload, and deploy-pages
      # refuses on "Multiple artifacts named github-pages" (#19, #28, #56).
      # Retrying only the deploy step is the version that works, because the
      # upload above has already run exactly once and is not repeated. Taking
      # the backend at its word about "later" before trying again.
      - name: Wait before retrying the deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Setup Node
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The step above reports on the deployment; this one reports on the
      # site. They have come apart in both directions — a red deploy whose
      # bytes had already landed, and a red deploy that really had left the
      # old app.js live — and telling those apart used to mean reading the
      # raw log for whether the cancel succeeded, then fetching files by
      # hand. `always()` so it still answers that question when the deploy
      # step is the thing that failed; page_url is empty in that case, so
      # fall back to the base URL Configure Pages resolved.
      - name: Verify the live site is this commit
        if: always()
        run: node wargame/scripts/live-check.js "${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.pages.outputs.base_url }}"
