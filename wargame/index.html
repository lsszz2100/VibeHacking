</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>

<div id="screen" class="crt">
  <!-- thin status HUD -->
  <header id="hud">
    <span class="hud-brand">VIBE//INFIL</span>
    <span class="hud-sep">│</span>
    <span class="hud-item">TARGET <b id="hudTarget">vibe.corp</b></span>
    <span class="hud-item">SCORE <b id="hudScore">0</b></span>
    <span class="hud-item">RANK <b id="hudRank">🥚</b></span>
    <span class="hud-item">BREACH <b id="hudSolved">0/455</b></span>
    <span class="hud-bar"><span id="hudBar"></span></span>
    <span class="hud-tools">
      <button id="soundBtn" class="hud-btn" title="sound">🔊</button>
      <button id="langBtn" class="hud-btn" title="language">EN</button>
    </span>
  </header>

  <!-- terminal output -->
  <main id="out" tabindex="0" aria-live="polite"></main>

  <!-- quick command chips (discoverability / mobile) -->
  <div id="chips">
    <button class="chip" data-cmd="help">help</button>
    <button class="chip" data-cmd="ls">ls</button>
    <button class="chip" data-cmd="map">map</button>
    <button class="chip" data-cmd="status">status</button>
    <button class="chip" data-cmd="hint">hint</button>
    <button class="chip" data-cmd="clear">clear</button>
  </div>

  <!-- command line -->
  <form id="cmdline" autocomplete="off">
    <span id="ps1" class="ps1">root@vibe:~$</span>
    <input id="cmd" type="text" spellcheck="false" autocomplete="off"
           autocapitalize="off" aria-label="command input">
    <span class="caret" aria-hidden="true"></span>
  </form>
</div>

<!-- planted: CSS-hidden flag (t1_css) -->
<div id="ghost" style="display:none" aria-hidden="true">FLAG{css_display_none_lies}</div>

<script src="assets/challenges.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
