[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibehacking"
version = "2.0.0"
description = "VibeHacking — The Practical Cybersecurity & AI Hacking Bible (75 Sections, 15 Labs, 1050 Wargame Challenges)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "lsszz2100", email = "lsszz2100@users.noreply.github.com"}
]
keywords = [
    "cybersecurity", "hacking", "ctf", "wargame", "pentesting",
    "red-team", "blue-team", "ai-security", "cloud-security"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pytest>=8.0.0",
    "fastapi>=0.110.0",
    "starlette>=0.36.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "flask>=3.0.0",
    "pymodbus>=3.6.0",
    "pyjwt>=2.8.0",
    "jinja2>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/lsszz2100/VibeHacking"
Repository = "https://github.com/lsszz2100/VibeHacking.git"
Issues = "https://github.com/lsszz2100/VibeHacking/issues"

[project.scripts]
vhack = "vhack:main"

[tool.setuptools]
py-modules = ["vhack"]

[tool.pytest.ini_options]
testpaths = ["labs", "infra"]
python_files = ["test_*.py"]
norecursedirs = [".*", "node_modules"]


