version: "3.8"

networks:
  web_lab_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.0.0/24

volumes:
  dvwa_data:
  juiceshop_data:

services:
  # -------------------------------------------------------
  # DVWA (Damn Vulnerable Web Application)
  # -------------------------------------------------------
  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: web_lab_dvwa
    restart: unless-stopped
    environment:
      - DB_SERVER=dvwa-db
    networks:
      web_lab_net:
        ipv4_address: 172.16.0.10
    expose:
      - "80"
    depends_on:
      - dvwa-db
    labels:
      - "lab=web-hacking"
      - "service=dvwa"

  dvwa-db:
    image: mysql:5.7
    container_name: web_lab_dvwa_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dvwa
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: p@ssw0rd
    volumes:
      - dvwa_data:/var/lib/mysql
    networks:
      web_lab_net:
        ipv4_address: 172.16.0.11
    labels:
      - "lab=web-hacking"
      - "service=dvwa-db"

  # -------------------------------------------------------
  # OWASP Juice Shop
  # -------------------------------------------------------
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: web_lab_juiceshop
    restart: unless-stopped
    networks:
      web_lab_net:
        ipv4_address: 172.16.0.20
    expose:
      - "3000"
    volumes:
      - juiceshop_data:/juice-shop/ftp
    labels:
      - "lab=web-hacking"
      - "service=juice-shop"

  # -------------------------------------------------------
  # WebGoat
  # -------------------------------------------------------
  webgoat:
    image: webgoat/webgoat:latest
    container_name: web_lab_webgoat
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
      - WEBGOAT_PORT=8080
      - WEBWOLF_PORT=9090
    networks:
      web_lab_net:
        ipv4_address: 172.16.0.30
    expose:
      - "8080"
      - "9090"
    labels:
      - "lab=web-hacking"
      - "service=webgoat"

  # -------------------------------------------------------
  # sqlmap-target: 커스텀 취약 Flask 앱 (SQLi 실습용)
  # -------------------------------------------------------
  sqlmap-target:
    build:
      context: ./sqlmap-target
      dockerfile: Dockerfile
    container_name: web_lab_sqlmap_target
    restart: unless-stopped
    networks:
      web_lab_net:
        ipv4_address: 172.16.0.40
    expose:
      - "5000"
    environment:
      - FLASK_ENV=development
      - DB_PATH=/app/users.db
    labels:
      - "lab=web-hacking"
      - "service=sqlmap-target"

  # -------------------------------------------------------
  # Nginx 리버스 프록시 (포트 80에서 경로 분기)
  # -------------------------------------------------------
  proxy:
    image: nginx:1.25-alpine
    container_name: web_lab_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - dvwa
      - juice-shop
      - webgoat
      - sqlmap-target
    networks:
      web_lab_net:
        ipv4_address: 172.16.0.2
    labels:
      - "lab=web-hacking"
      - "service=proxy"
